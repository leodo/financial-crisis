name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.step }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        step: [fmt, clippy, test, deny]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Format check
        if: matrix.step == 'fmt'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.step == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: matrix.step == 'test'
        run: cargo test --workspace

      - name: Deny
        if: matrix.step == 'deny'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all

  web:
    name: Web (${{ matrix.step }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        step: [build, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build
        if: matrix.step == 'build'
        run: npm run build
        working-directory: apps/web

      - name: Test
        if: matrix.step == 'test'
        run: npm run test
        working-directory: apps/web

  mvp-regression:
    name: MVP regression check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run static regression
        run: FC_SKIP_RUNTIME=1 FC_SKIP_RENDERED_UI=1 node scripts/mvp-runtime-regression-check.mjs
